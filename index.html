<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 · 谢谢爸爸妈妈 ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    overflow-x: hidden;
    background: radial-gradient(ellipse at 50% 0%, #4b2a63 0%, #2a1740 45%, #140b22 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  /* ========== 星空 ========== */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .stars span {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.6); }
    50%      { opacity: .95; transform: scale(1); }
  }

  /* ========== 飘浮爱心 ========== */
  .heart {
    position: fixed;
    bottom: -50px;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    line-height: 1;
    filter: drop-shadow(0 0 8px currentColor);
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0;   transform: translate3d(0, 0, 0) scale(.4) rotate(-12deg); }
    12%  { opacity: .9; }
    70%  { opacity: .65; }
    100% { opacity: 0;   transform: translate3d(var(--drift, 0px), -108vh, 0) scale(1.15) rotate(20deg); }
  }

  /* ========== 卡片 ========== */
  .card {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    padding: 42px 32px 36px;
    text-align: center;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 34px 80px -24px rgba(0, 0, 0, .8),
      0 0 90px -30px rgba(255, 120, 160, .65);
    animation: cardIn 1.1s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(46px) scale(.95); }
    to   { opacity: 1; transform: none; }
  }

  /* ========== 蛋糕 ========== */
  .cake {
    position: relative;
    width: 240px;
    height: 200px;
    margin: 0 auto 26px;
    animation: cakeIn 1.4s cubic-bezier(.2, .8, .3, 1) .25s both;
  }
  @keyframes cakeIn {
    from { opacity: 0; transform: translateY(26px) scale(.85); }
    to   { opacity: 1; transform: none; }
  }

  .plate {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 230px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f6e7d4, #c6a888);
    box-shadow: 0 16px 32px rgba(0,0,0,.55), inset 0 -4px 8px rgba(0,0,0,.15);
  }

  .layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 10px;
  }
  .layer::before {
    content: "";
    position: absolute;
    top: -8px; left: 0; right: 0;
    height: 18px;
    border-radius: 9px;
    background: #fff7fa;
  }
  .layer-1 {
    bottom: 16px;
    width: 180px; height: 68px;
    background: linear-gradient(180deg, #ffb0c6, #e2748f);
    box-shadow: inset 0 -12px 20px rgba(150, 30, 70, .35), 0 12px 24px rgba(0,0,0,.35);
  }
  .layer-1::before {
    box-shadow:
      16px 7px 0 -3px #fff7fa,
      52px 11px 0 -5px #fff7fa,
      96px 6px 0 -4px #fff7fa,
      132px 10px 0 -3px #fff7fa,
      160px 5px 0 -5px #fff7fa;
  }
  .layer-2 {
    bottom: 76px;
    width: 140px; height: 56px;
    background: linear-gradient(180deg, #ffd3de, #f39fb4);
    box-shadow: inset 0 -9px 16px rgba(150, 30, 70, .28), 0 10px 20px rgba(0,0,0,.3);
  }
  .layer-2::before {
    box-shadow:
      12px 6px 0 -3px #fff7fa,
      44px 10px 0 -4px #fff7fa,
      78px 5px 0 -3px #fff7fa,
      110px 9px 0 -4px #fff7fa;
  }

  .candle {
    position: absolute;
    left: 50%; bottom: 130px;
    transform: translateX(-50%);
    width: 12px; height: 42px;
    border-radius: 3px;
    background: repeating-linear-gradient(135deg, #ff7fa8 0 6px, #fff0f5 6px 12px);
    box-shadow: 0 0 14px rgba(255, 150, 180, .7);
  }

  .flame {
    position: absolute;
    left: 50%; bottom: 174px;
    width: 15px; height: 25px;
    border-radius: 50% 50% 48% 48% / 68% 68% 32% 32%;
    background: radial-gradient(ellipse at 50% 78%, #fffce8 0%, #ffd93d 34%, #ff9f1a 64%, #ff5400 100%);
    box-shadow: 0 0 22px 7px rgba(255, 170, 40, .65), 0 0 60px 18px rgba(255, 120, 40, .3);
    transform: translateX(-50%);
    transform-origin: bottom center;
    animation: flicker .45s infinite alternate ease-in-out;
  }
  @keyframes flicker {
    0%   { transform: translateX(-50%) scale(1, 1) rotate(-3deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.1, .92) rotate(3deg); opacity: .88; }
  }

  /* ========== 文字 ========== */
  .title {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    font-size: 34px;
    letter-spacing: 6px;
    color: #ffe9f1;
    text-shadow: 0 0 24px rgba(255, 130, 175, .85), 0 0 60px rgba(255, 90, 150, .45);
  }
  .subtitle {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(255, 214, 230, .75);
  }

  .letter {
    margin-top: 26px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    font-size: 17px;
    line-height: 2;
    letter-spacing: .6px;
    color: #f2e6f0;
  }
  .letter p { margin-bottom: 18px; }
  .letter p:last-child { margin-bottom: 0; }

  .wish {
    display: inline-block;
    padding: 6px 18px;
    font-size: 19px;
    font-weight: 700;
    color: #ffd6e6;
    border-radius: 14px;
    background: rgba(255, 140, 180, .12);
    border: 1px solid rgba(255, 170, 200, .28);
    text-shadow: 0 0 20px rgba(255, 140, 180, .8);
  }

  .sign {
    margin-top: 24px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: rgba(255, 200, 220, .8);
  }

  .btn {
    margin-top: 26px;
    padding: 14px 36px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #ff8fb3, #ff4d79);
    box-shadow:
      0 14px 30px -10px rgba(255, 77, 121, .85),
      inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow:
      0 20px 38px -12px rgba(255, 77, 121, .95),
      inset 0 1px 0 rgba(255, 255, 255, .5);
  }
  .btn:active { transform: scale(.96); }

  @media (max-width: 420px) {
    .card { padding: 34px 20px 30px; border-radius: 24px; }
    .cake { transform: scale(.88); margin-bottom: 12px; }
    .title { font-size: 28px; letter-spacing: 4px; }
    .letter { font-size: 16px; line-height: 1.95; }
    .wish { font-size: 17px; }
  }
</style>
</head>
<body>

  <!-- 卡片 -->
  <main class="card">

    <!-- 蛋糕 -->
    <div class="cake">
      <div class="plate"></div>
      <div class="layer layer-1"></div>
      <div class="layer layer-2"></div>
      <div class="candle"></div>
      <div class="flame"></div>
    </div>

    <h1 class="title">生日快乐</h1>
    <p class="subtitle">—— 致我最爱的爸爸妈妈 ——</p>

    <div class="letter">
      <p>
        小时候，你们是我的全世界；<br>
        长大后才懂得，是你们把全世界都给了我。
      </p>
      <p>
        谢谢你们，在我跌倒时伸出的那双手；<br>
        谢谢你们，在我任性时给的包容；<br>
        谢谢你们，把最好的都悄悄留给了我。
      </p>
      <p>
        生日的蜡烛可以许愿，<br>
        而我的愿望里，永远都有你们——
      </p>
      <p class="wish">
        愿爸爸妈妈<br>
        身体健康，笑口常开，岁岁平安
      </p>
      <p>
        也愿我能成为你们的骄傲，<br>
        像你们爱我一样，好好爱你们。
      </p>
    </div>

    <p class="sign">—— 永远爱你们的孩子 ——</p>

    <button class="btn" id="loveBtn">再收下一份爱 ❤</button>
  </main>

<script>
  /* ---------- 星空 ---------- */
  (function makeStars() {
    const field = document.createElement('div');
    field.className = 'stars';
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      s.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
      const size = 1 + Math.random() * 2.2;
      s.style.width = s.style.height = size + 'px';
      field.appendChild(s);
    }
    document.body.appendChild(field);
  })();

  /* ---------- 飘浮爱心 ---------- */
  const HEART_COLORS = ['#ff6b9d', '#ff8fab', '#ffb3c6', '#ffd6e0', '#ff4d79', '#ffa8c5', '#ffe0ec'];

  function spawnHeart(opt = {}) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '❤';

    const size = opt.size || (10 + Math.random() * 20);
    const dur = opt.dur || (7 + Math.random() * 6);

    h.style.fontSize = size + 'px';
    h.style.left = (2 + Math.random() * 96) + 'vw';
    h.style.color = HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0];
    h.style.animationDuration = dur + 's';
    h.style.setProperty('--drift', ((Math.random() * 160) - 80).toFixed(0) + 'px');

    document.body.appendChild(h);
    setTimeout(() => h.remove(), dur * 1000 + 600);
  }

  // 持续飘落
  setInterval(spawnHeart, 750);
  // 开场先来几颗
  for (let i = 0; i < 8; i++) setTimeout(spawnHeart, i * 220);

  /* ---------- 按钮：爱心爆发 ---------- */
  const btn = document.getElementById('loveBtn');
  const texts = ['再收下一份爱 ❤', '谢谢你们，我爱你们 ❤', '再点一次，还有更多 ❤'];

  btn.addEventListener('click', () => {
    for (let i = 0; i < 24; i++) {
      setTimeout(() => spawnHeart({ dur: 4.5 + Math.random() * 4 }), i * 45);
    }
    btn.textContent = texts[(Math.random() * texts.length) | 0];
  });
</script>
</body>
</html>
